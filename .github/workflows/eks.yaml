# 워크플로우(작업) 이름
name: GitOps ArgoCD CICD Pipeline

# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
      - main # 트리거 설정: main 브랜치에 푸시될 때 실행

jobs:
  build-and-update:
    runs-on: ubuntu-latest # 실제 작업 주체
    permissions:
      contents: write # git허브에 생성된 서버(runs-on에 정의된 서버)가 git에 업로드한 파일을 작성할 수 있는 권한(deployment파일 수정)
    steps:
      - name: 소스코드 체크아웃 # 깃에 push된 파일을 서버로 복사
        uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./nginx/Dockerfile # Dockerfile의 경로 및 파일명
          push: true
          tags: seok9/nginx:${{ github.sha }} # (중요) 이미지명 정의(태그 자동생성)

      - name: 쿠버네티스 파일의 이미지 태그 갱신 및 Git push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          sed -i 's|image: seok9/nginx:.*|image: seok9/nginx:${{ github.sha }}|g' ./k8s/deployment.yaml

          git add ./k8s/deployment.yaml
          git commit -m "deployment파일 image tag update"
          git push
    
 
