# 워크플로우(작업) 이름
name: GitOps docker CICD Pipeline

# 1. 트리거 설정: 브랜치 정의
on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest # 실제 작업 주체
    
    # 작업 절차
    steps:
    - name: 소스코드 전송
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{secrets.DOCKER_USER}}
        password: ${{secrets.DOCKER_PASSWORD}}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: "seok9/nginx:1.31.3-cd"
    - name: AWS 자격 증명 설정
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{secrets.AWS_ACCESS_KEY}}
        aws-secret-access-key: ${{secrets.AWS_SECRETS_ACCESS_KEY}}
        aws-region: ${{secrets.AWS_REGION}}

    - name: docker로 배포
      run: |
       aws ssm send-command \
        --instance-ids "i-04ded75b962b12fa9" \
        --document-name "AWS-RunShellScript" \
        --parameters "commands=[
          \"sudo docker pull seok9/nginx:1.31.3-cd\",
          \"docker stop nginx-container || true\",
          \"docker rm nginx-container\",
          \"docker run -d --name nginx-container -p 80:80 seok9/nginx:1.31.3-cd\"
        ]" \
        --region ${{secrets.AWS_REGION}} \
        --comment "Deploying SSM Docker"

